services:
  loggy-migrations:
    container_name: loggy-migrations
    build:
      context: .
      dockerfile: env.d/docker.d/Dockerfile
      target: production
    environment:
      - DATABASE_URL=${DATABASE_URL}
    command: >
      sh -c "
        echo 'Запуск Prisma миграций...' &&
        npx prisma migrate deploy &&
        echo 'Prisma миграции применены успешно'
      "
    restart: 'no'
    profiles:
      - migrations

  loggy-post-migration:
    image: postgres:15-alpine
    container_name: loggy-post-migration
    environment:
      - DATABASE_URL=${DATABASE_URL}
    command: >
      sh -c "
        echo 'Ожидание завершения Prisma миграций...' &&
        sleep 5 &&
        echo 'Применение post-migration.sql...' &&
        export PGPASSWORD=$$(echo $$DATABASE_URL | sed -n 's/.*:\/\/[^:]*:\([^@]*\)@.*/\1/p') &&
        export PGHOST=$$(echo $$DATABASE_URL | sed -n 's/.*@\([^:]*\):.*/\1/p') &&
        export PGPORT=$$(echo $$DATABASE_URL | sed -n 's/.*:\([0-9]*\)\/.*/\1/p') &&
        export PGDATABASE=$$(echo $$DATABASE_URL | sed -n 's/.*\/\([^?]*\).*/\1/p') &&
        export PGUSER=$$(echo $$DATABASE_URL | sed -n 's/.*:\/\/\([^:]*\):.*/\1/p') &&
        psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -d $$PGDATABASE -f /migrations/post-migration.sql &&
        echo 'post-migration.sql применен успешно'
      "
    volumes:
      - ./prisma/post-migration.sql:/migrations/post-migration.sql:ro
    restart: 'no'
    profiles:
      - migrations
    depends_on:
      - loggy-migrations

  loggy-backend-prod:
    container_name: loggy-backend-prod
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - '5000:3000'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - APP_ENV=${APP_ENV}
      - PORT=${PORT}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER}
      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRATION_TIME=${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}
      - JWT_REFRESH_TOKEN_EXPIRATION_TIME=${JWT_REFRESH_TOKEN_EXPIRATION_TIME}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS}
    command: >
      sh -c "
        echo 'Проверка и применение Prisma миграций...' &&
        npx prisma migrate deploy &&
        echo 'Prisma миграции применены' &&
        echo 'Миграции применены, запуск приложения...' &&
        npm run start:prod
      "
